<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>万物有声 · Everything Has A Voice</title>
<!--
  万物有声 · EVERYTHING HAS A VOICE —— 一镜到底动效片
  动效来源 (学习自三支抖音作品):
    ① @肖.Visual  「宝藏Skill｜手把手教你做3D全息动态交互闪卡」 → 多层视差 / 轮廓辉光 / 箔膜流光 / 交互倾斜
    ② @慕云 Verse 「情绪会传导和放大 凡事都会，因果累加」      → 体素裂解 / 链式传导 / 波带编队 / 聚蝶 / 漩涡爆色
    ③ @慕云 Verse 「Be wind, my friend 生命辽阔，你要乘风雄赳赳」 → 矢量流场 / 色域迁移 / 尾迹犁谷 / 花瓣绽放
  引擎: onetake (github.com/feitangyuan/onetake) — lib/motion.js 动作库, 纯函数 of t, 逐帧可 seek
-->
<style>
:root{
  --ground:#080b18; --deep:#080b18; --card:#15131f; --line:#2b2839;
  --mute:#8b8797; --ink:#f4f1ea; --accent:#f5c451; --accent2:#ff6f9d;
}
@font-face{font-family:'Inter';src:url('looks/fonts/Inter.ttf');font-weight:100 900;font-display:block}
@font-face{font-family:'InstrumentSerif';src:url('looks/fonts/InstrumentSerif.ttf');font-weight:400;font-display:block}
@font-face{font-family:'Archivo';src:url('looks/fonts/Archivo.ttf');font-weight:100 900;font-display:block}
@font-face{font-family:'GeistMono';src:url('looks/fonts/GeistMono.ttf');font-weight:100 900;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ground)}
body{font-family:'Inter','Microsoft YaHei',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
/* 舞台按窗口等比缩放 —— 窗口再小也看得全, 不再被裁掉一角。
   渲染器量到的视口恰是 1920×1080, 缩放系数恒为 1, 成片逐像素不变。 */
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  background:var(--deep);transform-origin:50% 50%;transform:translate(-50%,-50%) scale(1)}
#bg,#main{position:absolute;left:0;top:0;width:1920px;height:1080px}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
/* ── 标题 ── */
#title{font-size:104px;font-weight:700;letter-spacing:.02em;white-space:nowrap;line-height:1;
  font-family:'Microsoft YaHei','Inter',sans-serif;text-shadow:0 6px 40px rgba(0,0,0,.55)}
#sub{font-family:'GeistMono',monospace;font-size:22px;letter-spacing:.34em;color:var(--accent);white-space:nowrap;margin-top:14px}
#titWrap{left:96px;top:86px;z-index:6}
/* ── 字幕 ── */
#subwrap{position:absolute;left:0;right:0;bottom:64px;text-align:center;z-index:7}
#subcn{font-size:36px;font-weight:600;letter-spacing:.03em;color:#fff;text-shadow:0 4px 26px rgba(0,0,0,.75)}
#suben{font-family:'GeistMono',monospace;font-size:17px;letter-spacing:.2em;color:rgba(255,255,255,.62);margin-top:12px}
/* ── 落款 ── */
#lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9;opacity:0}
#lock .cn{font-size:172px;font-weight:700;letter-spacing:.06em;font-family:'Microsoft YaHei',sans-serif;line-height:1}
#lock .en{font-family:'GeistMono',monospace;font-size:26px;letter-spacing:.44em;color:var(--accent);margin-top:26px}
#lock .fn{font-family:'GeistMono',monospace;font-size:15px;letter-spacing:.2em;color:rgba(255,255,255,.42);margin-top:52px}
/* ── 交互提示 ── */
#hint{position:absolute;right:70px;bottom:56px;font-family:'GeistMono',monospace;font-size:15px;
  letter-spacing:.16em;color:rgba(255,255,255,.34);z-index:8;text-align:right;line-height:1.7}
#hud{position:absolute;right:12px;top:8px;font:13px 'GeistMono',monospace;color:#f5c451;display:none;z-index:20}
#cursor{position:absolute;left:0;top:0;width:34px;height:44px;z-index:10;pointer-events:none;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
/* ── 播放控制条 (只在交互模式下出现; 渲染模式 ?still 完全不显示) ── */
/* fixed + 在舞台之外: 不随画面缩放, 窗口再小也是原生尺寸 */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:40;
  display:none;align-items:center;gap:13px;padding:5px 15px 5px 6px;border-radius:999px;
  background:rgba(10,12,24,.66);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.11);box-shadow:0 8px 30px rgba(0,0,0,.45);
  opacity:0;pointer-events:none;transition:opacity .38s ease}
#bar.live{display:flex}
#bar.v{opacity:1;pointer-events:auto}
#play{width:30px;height:30px;flex:0 0 auto;border:0;border-radius:50%;cursor:pointer;
  background:#f5c451;color:#15131f;font:600 11px/1 'Inter',sans-serif;
  display:flex;align-items:center;justify-content:center;padding-left:1px}
#play:hover{background:#ffd76e}
#track{position:relative;width:286px;height:3px;border-radius:2px;background:rgba(255,255,255,.17);cursor:pointer}
#fill{position:absolute;left:0;top:0;height:100%;width:0;border-radius:2px;background:#f5c451}
#knob{position:absolute;top:50%;left:0;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 3px rgba(245,196,81,.34);opacity:0;transition:opacity .2s}
#track:hover #knob{opacity:1}
#tcode{font:11.5px 'GeistMono',monospace;letter-spacing:.05em;color:rgba(255,255,255,.74);white-space:nowrap}
#bar .lb{font:9.5px 'GeistMono',monospace;letter-spacing:.16em;color:rgba(255,255,255,.36);
  text-transform:uppercase;border-left:1px solid rgba(255,255,255,.13);padding-left:13px;white-space:nowrap}
#bar .dot{width:7px;height:7px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.24);
  cursor:pointer;transition:background .18s,transform .18s}
#bar .dot:hover{background:#f5c451;transform:scale(1.4)}
#bar .dot.cur{background:#f5c451}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <canvas id="main" width="1920" height="1080"></canvas>
  <div id="titWrap" class="abs"><div id="title">万物有声</div><div id="sub">EVERYTHING HAS A VOICE</div></div>
  <div id="subwrap"><div id="subcn"></div><div id="suben"></div></div>
  <div id="lock"><div class="cn">万物有声</div><div class="en">EVERYTHING HAS A VOICE</div>
    <div class="fn">当植物编织成乐器 · 一镜到底 · 动效引擎 onetake</div></div>
  <div id="hint">拖拽 / 移动鼠标 · 卡片会跟着你倾斜<br>DRAG TO TILT THE HOLOGRAM</div>
  <div id="hud"></div>
  <svg id="cursor" viewBox="0 0 34 44"><path d="M4 3 L30 22 L18 24 L26 40 L20 43 L12 27 L4 36 Z" fill="#fff" stroke="#15131f" stroke-width="2.2" stroke-linejoin="round"/></svg>
</div>
<div id="bar">
  <button id="play" title="播放 / 暂停 (空格)">▶</button>
  <div id="track"><div id="fill"></div><div id="knob"></div></div>
  <span id="tcode">00:00.00 / 00:22.50</span>
  <span class="lb">滚轮推进 · 空格播放</span>
  <span class="dot" data-t="0.55"  title="幕一 · 全息卡登场"></span>
  <span class="dot" data-t="4.16"  title="幕二 · 裂解 / 因果传导"></span>
  <span class="dot" data-t="7.40"  title="幕三 · 聚蝶 / 漩涡"></span>
  <span class="dot" data-t="12.95" title="幕四 · 流场 / 乘风"></span>
  <span class="dot" data-t="17.60" title="幕五 · 花瓣 / 归一"></span>
</div>
<script src="lib/motion.js"></script>
<script src="lib/ui_kit.js"></script>
<script src="js/art.js"></script>
<script src="js/swarm.js"></script>
<script src="js/flow.js"></script>
<script>
window.__ERRS = [];
addEventListener('error', e => window.__ERRS.push((e.message || 'err') + ' @' + (e.lineno || '?') + ':' + (e.colno || '?')));
addEventListener('unhandledrejection', e => window.__ERRS.push('reject: ' + (e.reason && e.reason.message || e.reason)));
// ════════════════════════════════════════════════════════════════════════════════════════
// 万物有声 —— 一切皆是 t 的纯函数。 __seek(t) 逐帧可渲染。
// ════════════════════════════════════════════════════════════════════════════════════════
const FPS = 30, DUR = 22.5, W = 1920, H = 1080;
window.__meta = { dur: DUR, fps: FPS, w: W, h: H };
const { clamp, lerp, sstep, ssstep, spring, ease, spline } = OM;

// ─────────────────────────── 时间表 (秒) ───────────────────────────
const T = {
  // 幕一 · 全息卡登场
  CARD_IN: 0.55, CARD_DT: 0.14, TITLE_IN: 0.22, HERO_UP: 1.55, TILT0: 2.05, TILT1: 4.05,
  // 幕二 · 裂解 · 因果传导
  HIT: 4.16, CELL_IN: 3.86, CELL_FULL: 4.52, CARD_OUT: 4.34, CARD_GONE: 4.95,
  LIFT: 4.30, WAVE: 1.25, RISE: 0.36, RIB0: 5.85, RIB1: 7.05,
  // 幕三 · 聚蝶 · 漩涡 —— 成型后停留 2.3s, 蝴蝶必须有时间被看清
  BF0: 7.40, BF1: 9.05, VT0: 11.35, VT1: 13.00, DIS0: 13.10, DIS1: 13.85,
  // 幕四 · 流场 · 乘风
  FLD_IN: 12.95, FLD_FULL: 14.55, ENTER: 13.65, EXIT: 20.4,
  // 幕五 · 花瓣 · 归一
  P0: 17.6, P1: 19.9, CARDBACK: 20.30, LOCK: 21.00,
};
const CARD_W = 580, CARD_H = 814, CS = CARD_W / ART.CW;      // 主角卡尺寸与缩放

// ─────────────────────────── 摄影机 (一台, 从不切换) ───────────────────────────
const CAM = [
  { t: 0.00, x: 960, y: 556, zoom: 1.07, rot: -0.004 },
  { t: 2.05, x: 958, y: 542, zoom: 1.15, rot: 0.002 },
  { t: 4.16, x: 962, y: 540, zoom: 1.235, rot: -0.003 },
  { t: 5.85, x: 1012, y: 534, zoom: 1.02, rot: 0.004 },
  { t: 9.05, x: 944, y: 530, zoom: 1.18, rot: -0.003, curve: ease.sineInOut },
  { t: 10.30, x: 962, y: 524, zoom: 1.215, rot: 0.003, curve: ease.sineInOut },
  { t: 11.35, x: 936, y: 548, zoom: 1.245, rot: 0.005, curve: ease.sineInOut },
  { t: 13.55, x: 838, y: 566, zoom: 1.02, rot: -0.004, curve: ease.cubicInOut },
  { t: 16.60, x: 968, y: 556, zoom: 1.10, rot: 0.003, curve: ease.sineInOut },
  { t: 19.40, x: 1140, y: 562, zoom: 1.20, rot: -0.003, curve: ease.smoother },
  { t: 21.40, x: 962, y: 540, zoom: 1.03, rot: 0.000, curve: ease.cubicInOut },
  { t: 22.00, x: 960, y: 540, zoom: 1.00, rot: 0.000, curve: ease.sineInOut },
];

// ─────────────────────────── 交互之手: 全程一条样条 ───────────────────────────
const HAND = [
  { t: 1.30, x: 1740, y: 1000 },
  { t: 1.95, x: 1120, y: 640 },
  { t: 2.35, x: 700, y: 470 },
  { t: 2.85, x: 1210, y: 760 },
  { t: 3.30, x: 780, y: 330 },
  { t: 3.75, x: 1180, y: 380 },
  { t: 4.10, x: 960, y: 540 },
  { t: 5.00, x: 1400, y: 900 },
];
const handAt = t => spline(HAND, t);
// 传给 flow.js 的时间表用它的键名约定
const TF = { enter: T.ENTER, exit: T.EXIT };

// ─────────────────────────── 字幕 ───────────────────────────
const SUBS = [
  [0.55, 4.05, '一张卡，一层层剥开', 'A CARD, LAYER BY LAYER'],
  [4.20, 7.35, '情绪会传导和放大，凡事都会', 'FEELING TRAVELS. IT AMPLIFIES.'],
  [7.55, 13.40, '一只蝴蝶扇动翅膀，因果层层累加', 'ONE WINGBEAT, A THOUSAND CONSEQUENCES'],
  [13.75, 17.35, 'Be wind, my friend. 别伤春悲秋', 'BE WIND, MY FRIEND'],
  [17.60, 20.80, '生命辽阔，你要乘风雄赳赳', 'THE WORLD IS WIDE — RIDE IT PROUD'],
];

// ─────────────────────────── 资源 ───────────────────────────
const gbg = document.getElementById('bg').getContext('2d');
const gm = document.getElementById('main').getContext('2d');
const CARDS = {}, FLATS = {};
let SWARM_ = null, FLOW_ = null;

// 背景: 胶片颗粒 (预生成一次, 每帧平铺) + 三团漂移柔光
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 220;
  const g = c.getContext('2d'), d = g.createImageData(220, 220);
  for (let i = 0; i < d.data.length; i += 4) {
    const v = 148 + (Math.random() * 107 | 0);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 13;
  }
  g.putImageData(d, 0, 0); return c;
})();
// [x, y, 色, 强度, 相位x, 相位y, 速度]
const MIST = [
  [0.30, 0.36, '#3b6bc4', 0.20, 0.41, 0.29, 1.7],
  [0.72, 0.66, '#7a3f8e', 0.15, 0.33, 0.37, 2.3],
  [0.52, 0.82, '#c98a3a', 0.10, 0.53, 0.23, 1.3],
];

function flatOf(card) {
  const c = document.createElement('canvas'); c.width = ART.CW; c.height = ART.CH;
  const g = c.getContext('2d');
  card.layers.forEach(L => g.drawImage(L.cv, 0, 0, ART.CW, ART.CH));
  return c;
}

// ─────────────────────────── 卡位 (幕一) ───────────────────────────
function slot(kind, t, rel) {
  // returns {x,y,w,h,rx,ry,rot,depth,foil,glow,alpha}
  const hero = kind === 'sax';
  const isHeroPhase = sstep(T.HERO_UP, T.HERO_UP + 0.75, rel);
  if (hero) {
    const w = lerp(CARD_W * 0.80, CARD_W, isHeroPhase);
    const h = w / CARD_W * CARD_H;
    return { w, h, ox: 0, oy: lerp(22, 0, isHeroPhase), s: lerp(0.90, 1, isHeroPhase) };
  }
  const side = kind === 'harp' ? -1 : 1;
  const w = lerp(CARD_W * 0.78, CARD_W * 0.62, isHeroPhase), h = w / CARD_W * CARD_H;
  return { w, h, ox: side * lerp(432, 548, isHeroPhase), oy: lerp(26, 44, isHeroPhase), s: lerp(0.94, 0.88, isHeroPhase), side };
}

// ─────────────────────────── __motion: 供渲染器自适应采样 ───────────────────────────
window.__motion = function (t0, t1) {
  let best = 0;
  const steps = 6;
  for (let i = 0; i <= steps; i++) {
    const a = lerp(t0, t1, i / steps);
    const c0 = OM.camera(a, CAM), c1 = OM.camera(a + 0.02, CAM);
    best = Math.max(best, Math.hypot(c1.x - c0.x, c1.y - c0.y) * 1.2 + Math.abs(Math.log(c1.zoom / c0.zoom)) * 900);
  }
  // 再加卡片/粒子的自身运动
  const tiltSpeed = (OM.camera(t1, CAM).x - OM.camera(t0, CAM).x);
  return Math.min(1400, best + Math.abs(tiltSpeed) * 0.6 + 210);
};

// ─────────────────────────── seek ───────────────────────────
function seek(t) {
  // ── 镜头 + 手持微浮 ──
  const cam = OM.camera(t, CAM);
  const floatx = Math.sin(t * 0.61) * 5 + Math.sin(t * 1.37 + 1.1) * 2.2;
  const floaty = Math.cos(t * 0.53) * 4 + Math.sin(t * 1.19 + 0.6) * 1.8;
  const rotFloat = Math.sin(t * 0.47 + 0.4) * 0.0016;
  const sh = OM.shake(t, T.HIT, { amp: 15, decay: 8.5, freq: 18, seed: 3 });
  const sh2 = OM.shake(t, 11.05, { amp: 9, decay: 7.5, freq: 15, seed: 8 });
  const camFinal = {
    x: cam.x + floatx + sh.x + sh2.x, y: cam.y + floaty + sh.y + sh2.y,
    zoom: cam.zoom, rot: cam.rot + rotFloat + sh.rot + sh2.rot,
  };
  const M = OM.view(camFinal, { W, H, depth: 0 });
  const apply = g => g.setTransform(M[0], M[1], M[2], M[3], M[4], M[5]);

  // ── 阶段量 ──
  const kTilt = ssstep(T.TILT0, T.TILT0 + 0.5, t) * (1 - ssstep(T.CARD_OUT, T.CARD_GONE, t));
  const kFlowIn = sstep(T.FLD_IN, T.FLD_FULL, t);
  const kFlowOut = 1 - sstep(T.CARDBACK - 0.72, T.CARDBACK + 0.42, t);
  const kFlowVis = kFlowIn * kFlowOut;
  const kRib = sstep(T.RIB0, T.RIB1, t);
  const kDis = sstep(T.DIS0, T.DIS1, t);

  // ══════════ 背景层 ══════════
  {
    gbg.setTransform(1, 0, 0, 1, 0, 0);
    gbg.globalAlpha = 1; gbg.filter = 'none';
    // 深靛蓝底 —— 不再是死黑, 画面才有空气
    const vg = gbg.createRadialGradient(W * 0.5, H * 0.46, 40, W * 0.5, H * 0.52, 1340);
    vg.addColorStop(0, '#1c2649'); vg.addColorStop(0.42, '#111a36'); vg.addColorStop(1, '#070a17');
    gbg.fillStyle = vg; gbg.fillRect(0, 0, W, H);
    // 三团缓慢漂移的柔光 (周期互质 → 永不重复), 流场起来后被盖住
    if (kFlowVis < 0.99) {
      gbg.save();
      gbg.globalCompositeOperation = 'lighter';
      for (const [mx, my, mc, ma, sx, sy, sp] of MIST) {
        const px = W * (mx + Math.sin(t * sp + sx * 9) * 0.046);
        const py = H * (my + Math.cos(t * sp * 0.83 + sy * 7) * 0.036);
        const rr = 640 * (0.86 + 0.14 * Math.sin(t * sp * 0.61));
        const mg = gbg.createRadialGradient(px, py, 0, px, py, rr);
        mg.addColorStop(0, mc); mg.addColorStop(1, 'rgba(0,0,0,0)');
        gbg.globalAlpha = ma * (1 - kFlowVis);
        gbg.fillStyle = mg; gbg.fillRect(0, 0, W, H);
      }
      gbg.restore();
      // 胶片颗粒, 消掉渐变的塑料味
      gbg.save(); gbg.globalAlpha = 0.55 * (1 - kFlowVis);
      if (!GRAIN.pat) GRAIN.pat = gbg.createPattern(GRAIN, 'repeat');
      gbg.fillStyle = GRAIN.pat; gbg.fillRect(0, 0, W, H);
      gbg.restore();
    }
    // 远处点阵 —— 让运镜有东西可以滑过 (onetake: 空场上运镜读不出来)
    if (kFlowIn < 1) {
      gbg.save(); gbg.globalAlpha = (1 - kFlowIn) * 0.34;
      const lat = OM.lattice(camFinal, { depth: 1.25, spacing: 62, px: 1.4, W, H });
      gbg.setTransform(...lat.matrix);
      gbg.fillStyle = '#3d4a70';
      const r = lat.r;
      for (let x = lat.x0; x <= lat.x1; x += lat.spacing)
        for (let y = lat.y0; y <= lat.y1; y += lat.spacing) {
          gbg.beginPath(); gbg.arc(x, y, r, 0, Math.PI * 2); gbg.fill();
        }
      gbg.restore();
    }
    // 流场底色 (随卡片回归一同退场)
    if (kFlowVis > 0) {
      gbg.save(); gbg.setTransform(M[0], M[1], M[2], M[3], M[4], M[5]);
      gbg.globalAlpha = kFlowVis;
      FLOW.drawGround(gbg, W, H, FLOW_ZONE(t), t);
      gbg.restore();
    }
  }

  // ══════════ 主层 ══════════
  gm.setTransform(1, 0, 0, 1, 0, 0);
  gm.filter = 'none'; gm.globalAlpha = 1; gm.globalCompositeOperation = 'source-over';
  gm.clearRect(0, 0, W, H);

  // ── 幕一/二 · 卡片 ──
  const cardAlpha = 1 - (window.__CARDMODE ? 0 : ssstep(T.CARD_OUT, T.CARD_GONE, t));
  if (cardAlpha > 0.002) {
    // 交互倾斜: 手样条驱动 / 真实鼠标驱动 (V1「Enable motion」+ 拖拽)
    const h = handAt(t);
    // 只有真鼠标动过才把倾斜交给鼠标; 否则用手样条扫动 —— 实时版和成片保持同一套运镜
    const mse = window.__MOUSETILT && window.__live && window.__liveSeen;
    const hx = mse ? window.__live.mx() * W : h[0];
    const hy = mse ? window.__live.my() * H : h[1];
    const nx = (hx - 960) / (mse ? 470 : 900);
    const ny = (hy - 540) / (mse ? 340 : 620);
    const aimRy = clamp(nx, mse ? -1.5 : -1, mse ? 1.5 : 1) * (mse ? 0.62 : 0.46);
    const aimRx = clamp(-ny, mse ? -1.5 : -1, mse ? 1.5 : 1) * (mse ? 0.44 : 0.30);
    const sweep = window.__CARDMODE ? 1 : sstep(T.TILT0, T.TILT0 + 0.42, t);
    const kT = window.__CARDMODE ? 1 : kTilt;
    const ry = aimRy * sweep * kT, rx = aimRx * sweep * kT;
    const order = ['harp', 'horn', 'sax'];
    order.forEach((kind, i) => {
      const card = CARDS[kind];
      const st = slot(kind, t, t);
      const isHero = kind === 'sax';
      const sub = sstep(T.CARD_IN + i * T.CARD_DT, T.CARD_IN + i * T.CARD_DT + 0.62, t);
      const p = spring(t - (T.CARD_IN + i * T.CARD_DT), 0.62, 18);
      const heroBoost = isHero ? 1 : (window.__CARDMODE ? 0.88 : (1 - ssstep(T.HERO_UP, T.HERO_UP + 0.7, t)));
      const a = sub * cardAlpha * (isHero ? 1 : 0.92) * heroBoost;
      if (a <= 0.004) return;
      const cxp = 960 + st.ox + (isHero ? 0 : 0), cyp = 540 + st.oy;
      const depthScale = isHero ? 1 : 0.42;            // 副卡视差弱一点, 读起来更远
      const dofB = isHero ? 0 : OM.dof(0.6, 0, { k: 3.4, max: 5.2 }) * (1 - kRib);
      apply(gm);
      ART.drawCard(gm, card, {
        x: cxp - st.w / 2, y: cyp - st.h / 2 + (1 - p) * 74, w: st.w * (0.94 + 0.06 * Math.min(1, p)), h: st.h * (0.94 + 0.06 * Math.min(1, p)),
        rx: rx * (isHero ? 1 : 0.55), ry: ry * (isHero ? 1 : 0.55),
        rot: (st.side || 0) * 0.055 * (1 - ssstep(T.HERO_UP, T.HERO_UP + 0.7, t)) + (1 - p) * (st.side || 0) * 0.06,
        depth: depthScale, foil: isHero ? (0.40 + 0.60 * sweep) : (0.28 + 0.34 * sweep), glow: isHero ? (0.30 + 0.55 * sweep) * (1 - kRib) : 0.14,
        alpha: a, blur: dofB, sheen: t * 0.9 + i * 1.7,
      });
    });
  }

  // ── 幕二/三 · 体素群 ──
  if (SWARM_ && t > T.CELL_IN - 0.05) {
    apply(gm);
    gm.globalAlpha = sstep(T.CELL_IN, T.CELL_FULL, t) * (1 - kDis);
    if (gm.globalAlpha > 0.003) {
      SWARM.draw(gm, SWARM_, t, {
        liftoff: T.LIFT, wave: T.WAVE, rise: T.RISE,
        rib0: T.RIB0, rib1: T.RIB1, bf0: T.BF0, bf1: T.BF1,
        vt0: T.VT0, vt1: T.VT1, dis0: T.DIS0, dis1: T.DIS1,
      }, { cx: 960, cy: 540, scale: CS * (1 + 0.06 * sstep(T.RIB0, T.RIB1, t)), depth: 1, glow: 0 });
    }
    gm.globalAlpha = 1;
  }

  // ── 幕四 · 流场 + 乘风者 ──
  if (kFlowVis > 0.002) {
    const ag = FLOW.agent(t, TF, W, H);
    apply(gm);
    gm.save();
    gm.globalAlpha = kFlowVis;
    FLOW.draw(gm, FLOW_, t, {
      alpha: 0.92 * sstep(T.FLD_IN - 0.2, T.FLD_FULL, t),
      k: FLOW_ZONE(t), tau: t, T: TF, agent: ag, trailW: sstep(T.ENTER, T.ENTER + 1.0, t),
    });
    gm.restore();
    // 乘风者
    const agOp = sstep(T.ENTER - 0.15, T.ENTER + 0.35, t) * (1 - ssstep(T.CARDBACK - 1.05, T.CARDBACK - 0.25, t));
    if (agOp > 0.004) { gm.save(); gm.globalAlpha = kFlowVis; FLOW.drawAgent(gm, ag, t, { alpha: agOp, scale: 1.85 }); gm.restore(); }
  }

  // ── 幕五 · 花瓣绽放 → 收束成卡 (承接, 不是切换) ──
  {
    apply(gm);
    FLOW.petals(gm, t, TF, W, H, {
      p0: T.P0, p1: T.P1, conv: T.CARDBACK,
      cx: 960, cy: 540, cw: CARD_W * 0.86, ch: CARD_H * 0.86,
      n: 330, alpha: 1,
    });
  }

  // ── 幕五 · 卡片归一 (闭环: 卡片从花瓣里长回来, 再缩进落款) ──
  const backOp = sstep(T.CARDBACK - 0.05, T.CARDBACK + 1.05, t);
  if (backOp > 0.004) {
    const p = spring(t - (T.CARDBACK - 0.05), 0.66, 15);
    const shrink = sstep(T.LOCK - 0.10, T.LOCK + 0.95, t);
    const w = lerp(CARD_W * 0.62, CARD_W * 0.86, Math.min(1, p)) * (1 - 0.66 * shrink);
    const h = w / CARD_W * CARD_H;
    const fade = 1 - ssstep(T.LOCK + 0.20, T.LOCK + 0.95, t);
    apply(gm);
    ART.drawCard(gm, CARDS.sax, {
      x: 960 - w / 2, y: 540 - h / 2 + (1 - p) * 60, w, h,
      rx: 0.10 * p + 0.5 * shrink, ry: 0.30 * p * (1 - ssstep(T.LOCK - 0.6, T.LOCK, t)) + 1.0 * shrink,
      rot: 0, depth: 1, foil: 1, glow: 0.62,
      alpha: backOp * fade, blur: 0, sheen: t * 0.8,
    });
  }

  // ══════════ DOM 层 ══════════
  // 标题
  {
    const tw = document.getElementById('titWrap');
    const inK = spring(t - T.TITLE_IN, 0.6, 20);
    const outK = ssstep(T.LOCK - 0.75, T.LOCK - 0.1, t);
    const wr = OM.wordRise(t, T.TITLE_IN, { zeta: 0.62, omega: 20, dist: 34 });
    tw.style.opacity = clamp(inK, 0, 1) * (1 - outK);
    tw.style.transform = `translateY(${wr.y.toFixed(1)}px) scale(${(0.97 + 0.03 * inK).toFixed(4)})`;
  }
  // 字幕
  {
    const scn = document.getElementById('subcn'), sen = document.getElementById('suben');
    const wrap = document.getElementById('subwrap');
    let act = null;
    if (!window.__CARDMODE) for (const q2 of SUBS) if (t >= q2[0] && t < q2[1]) { act = q2; break; }
    if (t >= T.LOCK + 0.1) act = null;
    if (act) {
      scn.textContent = act[2]; sen.textContent = act[3];
      const fade = Math.min(clamp((t - act[0]) / 0.32, 0, 1), clamp((act[1] - t) / 0.32, 0, 1));
      wrap.style.opacity = fade;
      wrap.style.transform = `translateY(${((1 - fade) * 16).toFixed(1)}px)`;
    } else {
      wrap.style.opacity = 0;
    }
  }
  // 落款
  {
    const lk = document.getElementById('lock');
    const g2 = ssstep(T.LOCK + 0.30, T.LOCK + 1.15, t);
    lk.style.opacity = g2;
    const s2 = lerp(1.22, 1.0, ease.expoOut(clamp((g2), 0, 1)));
    lk.style.transform = `scale(${s2.toFixed(4)})`;
    lk.style.letterSpacing = (0.06 + (1 - g2) * 0.16).toFixed(4) + 'em';
  }
  // 光标 (交互之手)
  {
    const vis = !window.__CARDMODE && t >= 1.28 && t <= 4.30;
    const cu = OM.cursor(t, HAND, [4.16]);
    const el = document.getElementById('cursor');
    el.style.opacity = vis ? 1 : 0;
    el.style.transform = `translate(${cu.x - 6}px,${cu.y - 4}px) scale(${cu.s})`;
  }
  // 提示
  const _hint = document.getElementById('hint');
  if (_hint) _hint.style.opacity = window.__EMBED ? 0 : (window.__CARDMODE ? 0.9 : (
    (t < T.CARD_OUT ? 0.6 * clamp((t - 1.2) / 0.9, 0, 1) : 0) * (window.__ISPLAY ? 1 : 0.6)));
  document.getElementById('hud').textContent = 't=' + t.toFixed(3);
  return Promise.resolve(true);
}

// 色域进度: 蓝 → 沙 → 绿
function FLOW_ZONE(t) {
  const a = sstep(14.1, 16.9, t) * 0.62;      // 蓝 → 沙
  const b = sstep(17.4, 19.6, t) * 0.38;      // 沙 → 绿
  return clamp(a + b, 0, 1);
}

// ─────────────────────────── 运行模式 ───────────────────────────
//  ?play / ?card / ?still / ?t=
//  ?embed         → 嵌入模式: 不自动播放、不接管滚轮/键盘、无控制条。
//                   由父页面调用 window.__seek(t) 与 window.__setMouse(x,y) 驱动。
const q = new URLSearchParams(location.search);
const MODE_STILL = q.has('t') || q.has('still');
window.__EMBED = q.has('embed');
window.__CARDMODE = q.has('card');
window.__ISPLAY = !MODE_STILL && !window.__CARDMODE && !window.__EMBED;
window.__MOUSETILT = window.__ISPLAY || window.__CARDMODE || window.__EMBED;
if (q.has('hud')) document.getElementById('hud').style.display = 'block';
if (window.__EMBED) {
  // 控制条与提示全部隐藏; 滚轮/键盘完全不接管(iframe 已 pointer-events:none, 滚动直接落到父页面)
  ['bar', 'hint', 'hud'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.style.display = 'none'; el.style.opacity = '0'; }
  });
  document.documentElement.style.cursor = 'default';
}

// ─────────────────────────── 舞台适配窗口 ───────────────────────────
// 1920×1080 的画布永远等比缩到窗口里 —— 窗口再小也看得全, 不再裁掉一角。
// 渲染器量到的视口恰是 1920×1080, 系数恒为 1, 成片逐像素不变。
(function fit() {
  const st = document.getElementById('stage');
  const apply = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    st.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  };
  apply(); addEventListener('resize', apply);
  addEventListener('orientationchange', apply);
})();

// ─────────────────────────── 就绪 ───────────────────────────
window.__ready = (async () => {
  await document.fonts.ready;
  ['sax', 'harp', 'horn'].forEach(k => { CARDS[k] = ART.build(k); FLATS[k] = flatOf(CARDS[k]); });
  // 56×68 = 3808 格 —— 原片是数千格密铺, 1260 格铺不满就成噪点云
  SWARM_ = SWARM.build(FLATS.sax, { cols: 56, rows: 68, W, H });
  FLOW_ = FLOW.build(W, H, { count: 1550, seed: 5 });
  await seek(q.has('t') ? parseFloat(q.get('t')) : (MODE_STILL ? 2.60 : 0));
  return true;
})();

window.__seek = async t => { await seek(clamp(t, 0, DUR)); return true; };
// 同步版: 父页面在 rAF 里逐帧调用, 不产生微任务队列堆积
window.__seekNow = t => { seek(clamp(t, 0, DUR)); return true; };

if (window.__MOUSETILT) {
  let mx = 0.5, my = 0.5;
  const read = e => {
    const r = document.getElementById('stage').getBoundingClientRect();
    mx = clamp((e.clientX - r.left) / r.width, 0, 1);
    my = clamp((e.clientY - r.top) / r.height, 0, 1);
    window.__liveSeen = true;   // 真鼠标接管后, 卡片倾斜才交给鼠标
  };
  addEventListener('mousemove', read);
  addEventListener('touchmove', e => { if (e.touches[0]) read(e.touches[0]); }, { passive: true });
  window.__live = { mx: () => mx, my: () => my };
  // 嵌入模式下鼠标在父页面, 由父页面把归一化坐标转发进来
  window.__setMouse = (x, y) => { mx = clamp(x, 0, 1); my = clamp(y, 0, 1); window.__liveSeen = true; };
}

// ─────────────────────────── 播放器 ───────────────────────────
if (window.__ISPLAY) {
  const $bar = document.getElementById('bar'), $track = document.getElementById('track');
  const $fill = document.getElementById('fill'), $knob = document.getElementById('knob');
  const $play = document.getElementById('play'), $tc = document.getElementById('tcode');
  const $dots = [].slice.call($bar.querySelectorAll('.dot'));
  const BEAT = [0.55, 4.16, 7.40, 12.95, 17.60];
  let clock = 0, playing = false, lastT = 0, scrubbing = false;

  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + (s % 60).toFixed(2).padStart(5, '0');
  const barSync = () => {
    const u = clamp(clock / DUR, 0, 1);
    $fill.style.width = (u * 100).toFixed(3) + '%';
    $knob.style.left = (u * 100).toFixed(3) + '%';
    $tc.textContent = fmt(clock) + ' / ' + fmt(DUR);
    let ci = -1; BEAT.forEach((b, i) => { if (clock >= b - 0.2) ci = i; });
    $dots.forEach((d, i) => d.classList.toggle('cur', i === ci));
  };
  const setPlay = on => { playing = on; $play.textContent = on ? '❚❚' : '▶'; barSync(); };
  const jump = t => { clock = clamp(t, 0, DUR); seek(clock); barSync(); };

  $bar.classList.add('live');
  $play.addEventListener('click', e => { e.stopPropagation(); setPlay(!playing); });
  $dots.forEach(d => d.addEventListener('click', e => { e.stopPropagation(); jump(parseFloat(d.dataset.t)); }));
  const atX = e => { const r = $track.getBoundingClientRect(); jump(clamp((e.clientX - r.left) / r.width, 0, 1) * DUR); };
  $track.addEventListener('mousedown', e => { e.stopPropagation(); scrubbing = true; atX(e); });
  addEventListener('mousemove', e => { if (scrubbing) atX(e); });
  addEventListener('mouseup', () => { scrubbing = false; });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); setPlay(!playing); }
    else if (e.code === 'ArrowLeft') jump(clock - 1);
    else if (e.code === 'ArrowRight') jump(clock + 1);
    else if (e.code === 'Home') jump(0);
  });
  // 点画面 = 播放/暂停
  document.getElementById('stage').addEventListener('click', () => { if (!scrubbing) setPlay(!playing); });

  // ── 滚轮 = 手动推进时间轴 ─────────────────────────────────────────
  // 上下滚动就是"手动控制画面变化": 往下滚前进、往上滚后退。
  // 滚一下就接管(暂停自动播放), 空格或播放键恢复。Shift + 滚动 = 精调。
  // 同一帧内的多次滚动合并成一次 seek, 3808 个粒子下才不卡。
  let wheelAcc = 0, wheelRaf = 0;
  const flushWheel = () => {
    wheelRaf = 0;
    if (!wheelAcc) return;
    if (playing) setPlay(false);
    jump(clamp(clock + wheelAcc, 0, DUR));
    wheelAcc = 0;
    reveal();
  };
  addEventListener('wheel', e => {
    e.preventDefault();
    const unit = e.deltaMode === 1 ? 16 : (e.deltaMode === 2 ? 220 : 1);
    wheelAcc += e.deltaY * unit * (e.shiftKey ? 0.0016 : 0.0072);
    if (!wheelRaf) wheelRaf = requestAnimationFrame(flushWheel);
  }, { passive: false });

  // 控制条随鼠标亮起, 停下 2.6s 后隐去 —— headless 渲染里鼠标事件永不触发, 成片永远干净
  let idle = null;
  const reveal = () => {
    $bar.classList.add('v'); clearTimeout(idle);
    idle = setTimeout(() => { if (playing && !scrubbing) $bar.classList.remove('v'); }, 2600);
  };
  addEventListener('mousemove', reveal);
  addEventListener('mouseleave', () => $bar.classList.remove('v'));
  reveal();

  const tick = now => {
    if (playing && !scrubbing) {
      if (!lastT) lastT = now;
      clock += (now - lastT) / 1000;
      if (clock >= DUR) clock -= DUR;   // 22.5s 一镜到底, 无缝循环
      seek(clock); barSync();
    }
    lastT = now;
    requestAnimationFrame(tick);
  };
  window.__ready.then(() => { seek(0); barSync(); setPlay(true); requestAnimationFrame(tick); });
} else if (window.__EMBED) {
  // 嵌入模式: 一帧都不自己推进, 完全等父页面的 __seekNow(t)
  window.__ready.then(() => { seek(0); window.__EMBED_READY = true; });
} else if (window.__CARDMODE) {
  // 光栅卡交互台: 钉在卡片那一拍, 倾斜完全由鼠标驱动 —— 就是 V1 那页
  document.getElementById('hint').style.opacity = 1;
  document.getElementById('hint').innerHTML = '移动鼠标 · 卡片跟着你倾斜<br><span style="opacity:.62">层间视差 = Depth ｜ 箔膜流光 = Foil</span>';
  window.__ready.then(() => {
    let tt = 3.25;
    (function loop() { seek(tt); tt = 3.25 + ((performance.now() / 1000) % 1000) * 0.0001; requestAnimationFrame(loop); })();
  });
}
</script>
</body>
</html>
